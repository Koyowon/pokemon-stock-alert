name: GS25 Android offline smoke (one approved push)

# One approved branch-only workflow-file push. No schedule or PR triggers.
on:
  push:
    branches:
      - test/gs25-android-emulator
    paths:
      - .github/workflows/gs25-android-smoke.yml

permissions:
  contents: read

concurrency:
  group: gs25-android-offline-smoke
  cancel-in-progress: false

jobs:
  android-offline-smoke:
    if: github.ref == 'refs/heads/test/gs25-android-emulator'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate offline mock parser
        run: python -m unittest discover -s gs25_prototype/android_test -p 'test_*.py' -v
      - name: Grant KVM access (runner only)
        shell: bash
        run: |
          test -e /dev/kvm || { echo 'KVM_NOT_AVAILABLE'; exit 1; }
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Prepare and syntax-check offline Android script
        shell: bash
        run: |
          cat > /tmp/gs25-android-offline.sh <<'GS25_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory gs25_prototype/android_test > /tmp/gs25-mock-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          echo MOCK_HTTP_HOST_CHECK
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8765/mock_screen.html | grep MOCK_001
          adb reverse tcp:8765 tcp:8765
          adb shell am start -a android.intent.action.VIEW -d http://127.0.0.1:8765/mock_screen.html
          sleep 3
          echo CHROME_FIRST_RUN_OFFLINE_DISMISS
          for attempt in 1 2 3 4 5; do
            adb shell uiautomator dump /sdcard/gs25-onboarding.xml >/dev/null
            adb pull /sdcard/gs25-onboarding.xml /tmp/gs25-onboarding.xml >/dev/null
            if ! python3 - <<'PY'
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse("/tmp/gs25-onboarding.xml").getroot()
          labels = {"Use without an account", "No thanks", "Not now", "Got it", "Continue without an account"}
          matches = [n for n in root.iter("node") if n.get("text") in labels or n.get("content-desc") in labels]
          if not matches:
              print("CHROME_ONBOARDING_BUTTON none")
              sys.exit(1)
          node = matches[0]
          print("CHROME_ONBOARDING_BUTTON", node.get("text") or node.get("content-desc"))
          bounds = [int(x) for x in re.findall(r"\d+", node.get("bounds", ""))]
          if len(bounds) != 4:
              sys.exit(1)
          subprocess.run(["adb", "shell", "input", "tap", str((bounds[0]+bounds[2])//2), str((bounds[1]+bounds[3])//2)], check=True)
          PY
            then
              break
            fi
            sleep 2
          done
          adb shell am start -a android.intent.action.VIEW -d http://127.0.0.1:8765/mock_screen.html
          sleep 12
          echo ANDROID_ACTIVITY_DIAGNOSTIC
          adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' || true
          adb shell uiautomator dump /sdcard/gs25-mock-window.xml >/dev/null
          adb pull /sdcard/gs25-mock-window.xml /tmp/gs25-mock-window.xml >/dev/null
          python3 - <<'PY'
          import sys
          from pathlib import Path
          import xml.etree.ElementTree as ET
          sys.path.insert(0, "gs25_prototype/android_test")
          from screen_reader import parse_mock_uiautomator_xml
          xml = Path("/tmp/gs25-mock-window.xml").read_text()
          nodes = list(ET.fromstring(xml).iter("node"))
          print("UI_NODE_COUNT", len(nodes))
          print("UI_TEXT_NODES", [(n.get("text"), n.get("content-desc")) for n in nodes if n.get("text") or n.get("content-desc")][:50])
          result = parse_mock_uiautomator_xml(xml)
          assert result == {"stores":[{"storeCode":"MOCK_001","storeName":"GS25 병점역점","realStockQuantity":2}]}, result
          print("ANDROID_MOCK_STOCK_PASS", result)
          PY
          GS25_SCRIPT
          bash -n /tmp/gs25-android-offline.sh
          echo BASH_SYNTAX_PASS
      - name: Boot Android and read local mock page
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash /tmp/gs25-android-offline.sh
