name: CU Pokemon 30th Registration Monitor

on:
  schedule:
    - cron: '3,18,33,48 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cu-registration-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check CU product registration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cu_registration_monitor.py

      - name: Save CU notification state only
        if: success()
        run: |
          if [ -f cu_registration_state.json ]; then
            git add cu_registration_state.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update CU registration notification state [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
