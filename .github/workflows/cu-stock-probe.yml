name: CU Stock Read-Only Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cu-stock-probe
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose CU target stock
        run: python cu_stock_probe.py
