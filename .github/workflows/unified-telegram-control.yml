name: Pokemon Unified Telegram Controls
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-unified-control
  cancel-in-progress: false
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Process Telegram controls
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 telegram_control.py
      - name: Save controls and Telegram cursor
        if: success()
        run: |
          git add unified_control.json telegram_control_cursor.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update unified Telegram controls [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
