name: Emart24 Jeonju Inventory Probe
on:
  workflow_dispatch:
    inputs:
      product_search_probe:
        description: 'Read-only exact barcode search and stock schema comparison (no alerts)'
        required: false
        type: boolean
        default: false
      compare_origin_relay:
        description: 'Run read-only Emart24 origin/relay and CU Asan comparison'
        required: false
        type: boolean
        default: false
      string_metadata_probe:
        description: 'Emart24 JSON type/structural validity (no values) and CU HTTP status'
        required: false
        type: boolean
        default: false
      safe_schema_diagnostic:
        description: 'Run privacy-safe schema diagnostic and CU registry audit (no Telegram)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only Jeonju inventory probe
        if: ${{ !inputs.compare_origin_relay && !inputs.safe_schema_diagnostic && !inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python emart24_jeonju_inventory_probe.py
      - name: Offline comparison self-test
        if: ${{ inputs.compare_origin_relay && !inputs.safe_schema_diagnostic && !inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python retail_origin_relay_diagnostic.py --self-test
      - name: Run bounded origin relay and CU Asan diagnostic
        if: ${{ inputs.compare_origin_relay && !inputs.safe_schema_diagnostic && !inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python retail_origin_relay_diagnostic.py
      - name: Offline privacy-safe schema self-test
        if: ${{ inputs.safe_schema_diagnostic && !inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python retail_schema_safe_diagnostic.py --self-test
      - name: Run privacy-safe schema and registry audit
        if: ${{ inputs.safe_schema_diagnostic && !inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python retail_schema_safe_diagnostic.py
      - name: String metadata self-test
        if: ${{ inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python retail_string_metadata_probe.py --self-test
      - name: Bounded string metadata and CU relay status
        if: ${{ inputs.string_metadata_probe && !inputs.product_search_probe }}
        run: python retail_string_metadata_probe.py
      - name: Product search offline self-test
        if: ${{ inputs.product_search_probe }}
        run: python emart24_product_search_probe.py --self-test
      - name: Emart24 exact barcode product search and structure comparison
        if: ${{ inputs.product_search_probe }}
        run: python emart24_product_search_probe.py
