name: GS25 Barcode Direct Stock Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stock-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test GS25 barcode inventory
        run: python gs25_stock_direct_test.py
