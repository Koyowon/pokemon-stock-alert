name: Install Stock Change Alerts (Once)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-stock-alert-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch all three monitors and check syntax
        run: |
          python3 install_stock_change_alerts.py
          python3 -m py_compile monitor.py cu_stock_monitor.py gs25_independent/gs25_auto_monitor.py
      - name: Commit changes
        run: |
          git add monitor.py cu_stock_monitor.py gs25_independent/gs25_auto_monitor.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add stock delta alerts and Naver map links [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
