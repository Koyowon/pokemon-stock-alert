name: Install Unified Region Controls (Once)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch monitor region selection
        run: |
          python3 install_unified_controls.py
          python3 -m py_compile monitor.py cu_stock_monitor.py gs25_independent/gs25_auto_monitor.py unified_settings.py telegram_control.py
      - name: Commit changed monitor files
        run: |
          git add monitor.py cu_stock_monitor.py gs25_independent/gs25_auto_monitor.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Connect all monitors to unified region controls [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
