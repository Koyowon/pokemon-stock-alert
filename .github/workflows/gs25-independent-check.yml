name: GS25 Independent Setup Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate GS25 independent configuration (no stock API calls)
        run: python3 gs25_independent/monitor.py
