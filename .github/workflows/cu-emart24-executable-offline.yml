name: CU Emart24 Executable Proposal Final Offline Gate
on:
  push:
    branches:
      - validation/cu-emart24-executable-workflows-20261016
    paths:
      - .github/workflows/cu-emart24-executable-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/cu-emart24-executable-workflows-20261016
          persist-credentials: false
      - name: Verify proposed executable workflows and cutover safety
        run: |
          python -m unittest discover -s tests -p test_executable_workflow.py -v
          python -m unittest discover -s tests -p test_predeploy_acceptance.py -v
          python -m unittest discover -s tests -p test_cutover_wiring.py -v
          python -m unittest discover -s tests -p test_production_state_candidate.py -v
          python -m unittest discover -s tests -p test_final_readiness.py -v
