name: GS25 Asan Approval Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approval-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate approvals without changing production state
        run: python3 validate_gs25_asan_approvals.py
