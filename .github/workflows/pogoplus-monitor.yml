name: GO Plus+ restock monitor
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - pogoplus_monitor.py
      - test_pogoplus_monitor.py
      - .github/workflows/pogoplus-monitor.yml
permissions:
  contents: write
concurrency:
  group: pogoplus-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test stock classification
        run: python -m unittest test_pogoplus_monitor -v
      - name: Install read-only browser support
        run: pip install playwright==1.56.0
      - name: Check stores and send Telegram
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python pogoplus_monitor.py
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pogoplus-report-${{ github.run_id }}
          path: pogoplus-report.json
          retention-days: 7
          if-no-files-found: ignore
