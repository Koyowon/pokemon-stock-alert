name: Pokemon Stock Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pokemon-stock-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check emart24 stock
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Save stock and store cache
        if: always()
        run: |
          git add state.json stores.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update stock/store cache [skip ci]'
            git pull --rebase
            git push
          fi

      - name: Save emart24 inventory health and summary
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          if [ -f emart24_inventory_health.json ]; then
            python inventory_health.py emart24
            git add emart24_inventory_health.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update emart24 inventory health [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
