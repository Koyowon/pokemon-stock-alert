name: CU Emart24 Predeploy Final Offline Acceptance
on:
  push:
    branches:
      - validation/cu-emart24-predeploy-ready-20261016
    paths:
      - .github/workflows/cu-emart24-predeploy-final.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/cu-emart24-predeploy-ready-20261016
          persist-credentials: false
      - name: Offline cutover acceptance only
        run: |
          python -m unittest discover -s tests -p test_predeploy_acceptance.py -v
          python -m unittest discover -s tests -p test_cutover_wiring.py -v
          python -m unittest discover -s tests -p test_production_state_candidate.py -v
          python -m unittest discover -s tests -p test_final_readiness.py -v
