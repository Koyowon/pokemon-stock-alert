name: Asan GS25 Candidate Validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh GS25 Asan candidates
        run: python3 asan_store_discovery.py
      - name: Validate candidate locations without changing stock state
        run: python3 asan_gs25_validate.py
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-gs25-validation
          path: |
            asan_gs25_candidates.csv
            asan_gs25_discovery_summary.json
            asan_gs25_validation.csv
            asan_gs25_validation_summary.json
          if-no-files-found: warn
          retention-days: 30
