name: GS25 Pokemon 30th Stock Monitor

on:
  schedule:
    - cron: '4,9,14,19,24,29,34,39,44,49,54,59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gs25-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check GS25 stock and send Telegram alerts for new positives
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 gs25_independent/gs25_auto_monitor.py
      - name: Save GS25 state
        if: always()
        run: |
          if [ -f gs25_independent/gs25_stock_state.json ]; then
            git add gs25_independent/gs25_stock_state.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update GS25 stock state [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi

      - name: Save gs25 inventory health and summary
        if: ${{ always() && github.ref == 'refs/heads/main' }}
        run: |
          if [ -f gs25_inventory_health.json ]; then
            python inventory_health.py gs25
            git add gs25_inventory_health.json
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Update gs25 inventory health [skip ci]'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
