name: GS25 Asan Code Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only GS25 Asan code lookup
        run: python3 gs25_asan_code_probe.py
      - name: Upload code probe CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs25-asan-code-probe
          path: gs25_asan_code_probe.csv
          if-no-files-found: warn
