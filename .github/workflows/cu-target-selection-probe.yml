name: CU Target Selection Read-Only Probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cu-target-selection-probe
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run CU target selection diagnostic
        run: python cu_target_selection_probe.py
