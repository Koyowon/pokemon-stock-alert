name: GS25 Asan Boundary Review
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install geometry library
        run: python -m pip install 'shapely>=2,<3'
      - name: Check OSM points against Asan administrative boundary
        run: python verify_asan_boundary.py
      - name: Upload boundary review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gs25-asan-boundary-review
          path: |
            gs25_asan_boundary_review.csv
            gs25_asan_boundary_summary.json
          if-no-files-found: warn
