name: CU Emart24 Read Only Cutover Preparation
on:
  push:
    branches:
      - validation/cu-emart24-readonly-preparation-20261016
    paths:
      - .github/workflows/cu-emart24-cutover-preparation-offline.yml
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/cu-emart24-readonly-preparation-20261016
          persist-credentials: false
      - name: All cutover offline tests
        run: |
          python -m unittest discover -s tests -p test_cutover_readonly_plan.py -v
          python -m unittest discover -s tests -p test_approval_policy.py -v
          python -m unittest discover -s tests -p test_legacy_migration.py -v
          python -m unittest discover -s tests -p test_release_preflight.py -v
          python -m unittest discover -s tests -p test_executable_workflow.py -v
          python -m unittest discover -s tests -p test_predeploy_acceptance.py -v
          python -m unittest discover -s tests -p test_cutover_wiring.py -v
          python -m unittest discover -s tests -p test_production_state_candidate.py -v
          python -m unittest discover -s tests -p test_final_readiness.py -v
