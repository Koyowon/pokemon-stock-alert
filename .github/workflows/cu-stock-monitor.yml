name: CU Pokemon 30th Stock Monitor

# On this test branch, run only the Asan observation probe.
# The main branch retains its original scheduled monitoring workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cu-asan-observation-test
  cancel-in-progress: false

jobs:
  observe-asan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run offline regression tests
        run: python -m unittest -v test_cu_asan_registry test_cu_monitor_isolation test_asan_registry_quality test_asan_live_observation test_asan_coordinate_expansion test_asan_unmatched_diagnostic test_asan_safe_address

      - name: Observe Asan CU candidates (read-only, no Telegram)
        run: python asan_live_observation.py --live --include-provisional-coordinates --output asan_live_observation_result.json

      - name: Upload Asan observation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-cu-observation-report
          path: asan_live_observation_result.json
          if-no-files-found: warn
          retention-days: 7
