name: CU Emart24 Integrated Cutover Offline Gate
on:
  push:
    branches:
      - validation/cu-emart24-integrated-final-20261016
    paths:
      - .github/workflows/cu-emart24-integrated-offline.yml
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/cu-emart24-integrated-final-20261016
          persist-credentials: false
      - name: Offline integration acceptance
        run: |
          python -m unittest discover -s tests -p test_cutover_wiring.py -v
          python -m unittest discover -s tests -p test_production_state_candidate.py -v
          python -m unittest discover -s tests -p test_final_readiness.py -v
