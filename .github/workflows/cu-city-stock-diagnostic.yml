name: CU City Stock Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cu-city-stock-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Diagnose Namwon and Asan CU stock
        run: python cu_city_stock_diagnostic.py
