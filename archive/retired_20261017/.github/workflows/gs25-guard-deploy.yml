name: GS25 Asan Guard Deploy

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gs25-stock-monitor
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded patch
        run: python3 integrate_gs25_guard.py
      - name: Guard tests
        run: python3 -m unittest discover -s gs25_independent -p 'test_gs25_asan_guard.py' -v
      - name: Integration regression tests
        run: python3 test_gs25_guard_integration.py
      - name: Verify no stock state change
        run: git diff --exit-code -- gs25_independent/gs25_stock_state.json
      - name: Commit monitor change only
        run: |
          git add gs25_independent/gs25_auto_monitor.py
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Enable conservative GS25 Asan store guard [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo 'ALREADY_DEPLOYED'
          fi
