<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>포켓몬 30주년팩 재고 현황판</title><style>body{font:15px system-ui;background:#f5f7fb;color:#1e293b;margin:0}main{max-width:950px;margin:auto;padding:20px}section{background:white;padding:20px;border-radius:15px;margin:12px 0}input,select,button{padding:10px;margin:3px;border:1px solid #ccd3df;border-radius:9px;background:white}button{background:#243c7b;color:white}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #eee;padding:9px 4px}small{color:#64748b}.scroll{overflow:auto}</style><main><section><h2>🎴 포켓몬 30주년팩 재고 현황</h2><p>CU · 이마트24 · GS25 | 남원 · 아산 · 전주</p><small>GitHub 마지막 저장 수량이며 실시간 재고는 아닙니다.</small></section><section><select id="city"><option value="">전체 지역</option><option>남원</option><option>아산</option><option>전주</option></select><select id="chain"><option value="">전체 편의점</option><option>CU</option><option>이마트24</option><option>GS25</option></select><select id="status"><option value="">전체 상태</option><option value="yes">재고 있음</option><option value="no">0개</option><option value="unknown">미확인</option></select><input id="q" placeholder="점포명 검색"><button onclick="load()">새로고침</button><p id="msg">불러오는 중…</p><p id="count"></p><div class="scroll"><table><thead><tr><th>편의점</th><th>지역</th><th>점포명</th><th>수량</th></tr></thead><tbody id="body"></tbody></table></div></section></main><script>
const base='https://raw.githubusercontent.com/Koyowon/pokemon-stock-alert/main/';const $=id=>document.getElementById(id);let all=[];const region=s=>/남원/.test(s)?'남원':/아산/.test(s)?'아산':/전주/.test(s)?'전주':null;const qty=n=>Number.isInteger(n)&&n>=0?n:null;const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function read(path){let r=await fetch(base+path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(path+' '+r.status);return r.json()}
async function load(){ $('msg').textContent='조회 중…';try{const [cu,em,stores,gs]=await Promise.all([read('cu_stock_state.json'),read('state.json'),read('stores.json'),read('gs25_independent/gs25_stock_state.json')]);let rows=[];for(const [id,v] of Object.entries(cu.stores||{})){const city=v.city||region(v.address);if(['남원','아산','전주'].includes(city))rows.push({chain:'CU',city,name:v.name||id,qty:qty(v.stock)})}
let seen=new Set();for(const [key,n] of Object.entries(em)){const [chain,id,barcode]=key.split('|');if(chain!=='emart24'||barcode!=='8800286275732')continue;const s=stores.stores?.[id]||{};const city=region(s.address||s.name||'');if(city){seen.add(id);rows.push({chain:'이마트24',city,name:s.name||id,qty:qty(n)})}}for(const [id,s] of Object.entries(stores.stores||{})){if(seen.has(id))continue;const city=region(s.address||s.name||'');if(city)rows.push({chain:'이마트24',city,name:s.name||id,qty:null})}
for(const [key,v] of Object.entries(gs.regions||{})){const city={namwon:'남원',asan:'아산',jeonju:'전주'}[key];if(!city)continue;for(const [id,s] of Object.entries(v.stores||{}))rows.push({chain:'GS25',city,name:s.name||id,qty:qty(s.quantity)})}all=rows;render();$('msg').textContent='파일 확인: '+new Date().toLocaleString('ko-KR')+' (편의점별 마지막 재고조회 시각과 다를 수 있음)'}catch(e){$('msg').textContent='조회 실패: '+e.message}}
function render(){let c=$('city').value,h=$('chain').value,s=$('status').value,q=$('q').value.trim().toLowerCase();let a=all.filter(x=>(!c||x.city===c)&&(!h||x.chain===h)&&(!q||x.name.toLowerCase().includes(q))&&(!s||(s==='yes'?x.qty>0:s==='no'?x.qty===0:x.qty===null)));a.sort((x,y)=>(y.qty>0)-(x.qty>0)||x.city.localeCompare(y.city,'ko'));$('count').textContent='표시 '+a.length+'개 점포 · 재고 있음 '+a.filter(x=>x.qty>0).length+' · 0개 '+a.filter(x=>x.qty===0).length+' · 미확인 '+a.filter(x=>x.qty===null).length;$('body').innerHTML=a.map(x=>'<tr><td>'+esc(x.chain)+'</td><td>'+esc(x.city)+'</td><td>'+esc(x.name)+'</td><td>'+ (x.qty===null?'미확인':x.qty+'개')+'</td></tr>').join('')||'<tr><td colspan="4">해당 점포 없음</td></tr>'}for(const id of ['city','chain','status','q'])$(id).addEventListener('input',render);load();
</script></html>
